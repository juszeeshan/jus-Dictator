<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jus Dictator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17181a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#ddddd6;--acc:#2f5fd0;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222427;--ink:#ececea;--mute:#9a9a95;--line:#34363a;--acc:#6f95f0;--accink:#0d1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222427;--ink:#ececea;--mute:#9a9a95;--line:#34363a;--acc:#6f95f0;--accink:#0d1220;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{position:relative;display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:16px;margin:0;flex:1}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;min-width:0;overflow:hidden;padding:8px;display:flex;justify-content:center;align-items:center}
#wrap{width:100%;height:100%;display:flex;justify-content:center;align-items:center}
canvas{background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);display:block}
#empty{color:var(--mute);text-align:center;margin-top:12vh}
#panel{background:var(--card);border-top:1px solid var(--line);padding:6px 12px 8px;font-size:14px}
#chunk{min-height:26px;text-align:center;font-size:19px;font-weight:600}
#chunk.hide{visibility:hidden}
.row{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin:4px 0}
.row .btn{flex:1;min-width:0;padding:10px 0;font-size:18px;text-align:center}
.row .btn.pri{flex:1.5}
.row label{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px}
select,input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:64px}
#voice{max-width:230px}
#pg{color:var(--mute);font-size:13px}
#menu{position:absolute;right:10px;top:100%;margin-top:6px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(330px,calc(100vw - 20px));max-height:70dvh;overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.35);display:grid;gap:12px}
#menu label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
#menu select{max-width:190px}
#menu input[type=checkbox]{width:20px;height:20px}
@media (orientation:landscape) and (max-height:560px){header{padding:3px 10px}#chunk{font-size:16px;min-height:22px}}
</style>
</head>
<body>
<header>
  <h1>Jus Dictator</h1>
  <span id="pg">– / –</span>
  <label class="btn pri" for="file">Upload PDF</label>
  <input id="file" type="file" accept="application/pdf" hidden>
  <button class="btn" id="dots" aria-label="Options" title="Options">⋮</button>
  <div id="menu" hidden>
    <label>Go to page <input id="goto" type="number" min="1" value="1"></label>
    <label>Words at a time <input id="n" type="number" min="1" max="12" value="3"></label>
    <label>Writing time per word <select id="pace">
      <option value="0.6">0.6 s</option><option value="0.9">0.9 s</option><option value="1.2" selected>1.2 s</option>
      <option value="1.6">1.6 s</option><option value="2">2 s</option><option value="3">3 s</option>
    </select></label>
    <label>Voice <select id="voice"></select></label>
    <label>Speech speed <select id="rate">
      <option value="0.6">0.6×</option><option value="0.8">0.8×</option><option value="1" selected>1×</option>
      <option value="1.2">1.2×</option>
    </select></label>
    <label>Show words <input type="checkbox" id="show" checked></label>
  </div>
</header>

<div id="main">
<div id="stage"><div id="wrap">
  <div id="empty">Upload a PDF to start.<br>The voice will read a few words at a time, then wait for you to write.</div>
  <canvas id="cv" hidden></canvas>
</div></div>

<div id="panel">
  <div id="chunk" class="hide"></div>
  <div class="row">
    <button class="btn" id="prevPg" title="Previous page" aria-label="Previous page">⏮</button>
    <button class="btn" id="back" title="Previous words" aria-label="Previous words">⏪</button>
    <button class="btn" id="rep" title="Repeat" aria-label="Repeat">↻</button>
    <button class="btn pri" id="play" title="Play / pause" aria-label="Play or pause">▶</button>
    <button class="btn" id="next" title="Next words" aria-label="Next words">⏩</button>
    <button class="btn" id="nextPg" title="Next page" aria-label="Next page">⏭</button>
  </div>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = id => document.getElementById(id);
const S = { doc:null, key:"", page:1, words:[], idx:0, playing:false, timer:null, tok:0, last:"" };
const syn = window.speechSynthesis;

function save(){ try{ if(S.key) localStorage.setItem("dict:"+S.key, JSON.stringify({p:S.page,i:S.idx})); }catch(e){} }
function saveSettings(){ try{ localStorage.setItem("dict:settings", JSON.stringify({n:$("n").value,pace:$("pace").value,rate:$("rate").value,voice:$("voice").value,show:$("show").checked})); }catch(e){} }
function loadSettings(){ try{ const s=JSON.parse(localStorage.getItem("dict:settings")||"null"); if(s){ $("n").value=s.n; $("pace").value=s.pace; $("rate").value=s.rate; $("show").checked=s.show; S.voicePref=s.voice; } }catch(e){} }

function fillVoices(){
  const v = syn.getVoices(); if(!v.length) return;
  const cur = $("voice").value || S.voicePref;
  $("voice").innerHTML = v.map((x,i)=>`<option value="${x.name}">${x.name} (${x.lang})</option>`).join("");
  const pick = v.find(x=>x.name===cur) || v.find(x=>x.lang.startsWith("en")) || v[0];
  $("voice").value = pick.name;
}
loadSettings(); fillVoices(); syn.onvoiceschanged = fillVoices;

let rz, rtask;
async function draw(){
  if(!S.pg) return;
  const st=$("stage"), cs=getComputedStyle(st);
  const w=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(w<20||h<20) return;
  const base=S.pg.getViewport({scale:1}), fit=Math.min(w/base.width,h/base.height), dpr=window.devicePixelRatio||1;
  const vp=S.pg.getViewport({scale:fit*dpr}), cv=$("cv");
  if(rtask){ try{rtask.cancel();}catch(e){} }
  cv.style.width=Math.floor(base.width*fit)+"px"; cv.style.height=Math.floor(base.height*fit)+"px";
  cv.width=vp.width; cv.height=vp.height;
  rtask=S.pg.render({canvasContext:cv.getContext("2d"), viewport:vp});
  try{ await rtask.promise; }catch(e){}
}

async function showPage(n, idx=0){
  S.tok++; syn.cancel(); clearTimeout(S.timer);
  n = Math.max(1, Math.min(S.doc.numPages, n));
  S.page = n; S.idx = idx;
  S.pg = await S.doc.getPage(n);
  await draw();
  const tc = await S.pg.getTextContent();
  S.words = tc.items.map(i=>i.str).join(" ").split(/\s+/).filter(Boolean);
  $("pg").textContent = n+" / "+S.doc.numPages;
  $("goto").value = n; $("goto").max = S.doc.numPages;
  $("chunk").textContent = S.words.length ? "" : "No selectable text on this page";
  $("chunk").classList.toggle("hide", !S.words.length || !$("show").checked);
  save();
}

function nWords(){ return Math.max(1, Math.min(12, parseInt($("n").value)||3)); }

function speak(text, done){
  const t = S.tok, u = new SpeechSynthesisUtterance(text);
  const v = syn.getVoices().find(x=>x.name===$("voice").value); if(v){ u.voice=v; u.lang=v.lang; }
  u.rate = parseFloat($("rate").value);
  u.onend = ()=>{ if(t===S.tok) done(); };
  u.onerror = ()=>{ if(t===S.tok) done(); };
  syn.speak(u);
}

async function step(){
  if(!S.playing) return;
  if(S.idx >= S.words.length){
    if(S.page >= S.doc.numPages){ stop(); $("chunk").textContent="Finished 🎉"; $("chunk").classList.remove("hide"); return; }
    await showPage(S.page+1); return step();
  }
  const k = nWords(), text = S.words.slice(S.idx, S.idx+k).join(" "), cnt = Math.min(k, S.words.length-S.idx);
  S.last = text; $("chunk").textContent = text; $("chunk").classList.toggle("hide", !$("show").checked);
  const t = S.tok;
  speak(text, ()=>{
    S.idx += cnt; save();
    const wait = cnt * parseFloat($("pace").value) * 1000;
    S.timer = setTimeout(()=>{ if(t===S.tok) step(); }, wait);
  });
}

function play(){ if(!S.doc) return; S.playing=true; $("play").textContent="⏸"; S.tok++; step(); }
function stop(){ S.playing=false; S.tok++; syn.cancel(); clearTimeout(S.timer); $("play").textContent="▶"; }
function jump(newIdx){
  if(!S.doc) return; const was=S.playing; stop();
  S.idx = Math.max(0, Math.min(S.words.length, newIdx)); save();
  if(was) play(); else $("chunk").textContent = S.words.slice(S.idx,S.idx+nWords()).join(" ");
}

$("play").onclick = ()=> S.playing ? stop() : play();
$("back").onclick = ()=> jump(S.idx - nWords());
$("next").onclick = ()=> jump(S.idx + nWords());
$("rep").onclick  = ()=> { if(!S.doc) return; const was=S.playing; stop(); S.playing=true; S.tok++; const t=S.tok;
  speak(S.last || S.words.slice(S.idx,S.idx+nWords()).join(" "), ()=>{ if(t!==S.tok) return; S.playing=false; if(was) play(); }); };
$("prevPg").onclick = async ()=>{ if(!S.doc) return; const was=S.playing; stop(); await showPage(S.page-1); if(was) play(); };
$("nextPg").onclick = async ()=>{ if(!S.doc) return; const was=S.playing; stop(); await showPage(S.page+1); if(was) play(); };
$("goto").onchange = async ()=>{ if(!S.doc) return; const was=S.playing; stop(); await showPage(parseInt($("goto").value)||1); if(was) play(); };
["n","pace","rate","voice","show"].forEach(id=> $(id).addEventListener("change", ()=>{ saveSettings(); if(id==="show") $("chunk").classList.toggle("hide", !$("show").checked); }));

$("dots").onclick=e=>{ e.stopPropagation(); $("menu").hidden=!$("menu").hidden; };
document.addEventListener("click",e=>{ if(!$("menu").hidden && !$("menu").contains(e.target)) $("menu").hidden=true; });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") $("menu").hidden=true;
  if(["INPUT","SELECT"].includes(document.activeElement.tagName) && e.key!=="Escape") return;
  if(e.code==="Space"){ e.preventDefault(); $("play").click(); }
  else if(e.key==="ArrowLeft") $("back").click();
  else if(e.key==="ArrowRight") $("next").click();
  else if(e.key==="r"||e.key==="R") $("rep").click();
});

$("file").onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  stop(); $("empty").textContent = "Loading…"; $("empty").hidden = false;
  try{
    S.doc = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  }catch(err){ $("empty").textContent = "Couldn’t open that PDF."; return; }
  S.key = f.name+"|"+f.size; let p=1,i=0;
  try{ const r=JSON.parse(localStorage.getItem("dict:"+S.key)||"null"); if(r){ p=r.p; i=r.i; } }catch(_){}
  $("empty").hidden = true; $("cv").hidden = false;
  await showPage(p, i);
  $("chunk").textContent = S.words.slice(S.idx,S.idx+nWords()).join(" ");
  $("chunk").classList.toggle("hide", !$("show").checked);
};
window.addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(draw,120); });
window.addEventListener("orientationchange", ()=>{ clearTimeout(rz); rz=setTimeout(draw,300); });
if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
